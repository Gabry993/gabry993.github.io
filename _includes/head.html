<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% if page.title %}{{ page.title | escape }} - {{ site.title | escape }}{% else %}{{ site.title | escape }}{%
    endif %}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/main.css' | relative_url }}">
  <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">
  <link rel="shortcut icon" type="image/x-icon" href="{{ site.url }}{{ site.baseurl }}/favicon.ico">
  <!-- <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"> -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fork-awesome@1.2.0/css/fork-awesome.min.css"
    integrity="sha256-XoaMnoYC5TH6/+ihMEnospgm0J1PM/nioxbOUdnM8HY=" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons/css/academicons.min.css">
  <link rel="preconnect" href="https://player.vimeo.com">
  <link rel="preconnect" href="https://i.vimeocdn.com">
  <link rel="preconnect" href="https://f.vimeocdn.com">
  <style>
    /* Normalize icon alignment in the about page social links */
    .icon-link .fa,
    .icon-link .ai {
      vertical-align: middle;
      line-height: 1;
      color: #fff;
    }

    /* Fine-tune academicons specifically — shift up to match Fork Awesome */
    .ai {
      position: relative;
      top: -1px;
      /* adjust between -2px and -4px to taste */
    }

    .icon-link {
      --icon-size: 1.5em;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 1.5em;
      height: 1.5em;
      font-size: var(--icon-size);
      /* replaces fa-3x / ai-3x */
      border-radius: 12px;
      /* your chosen rounding — same for all */
      background-color: currentColor;
      color: #fff;
      text-decoration: none;
      vertical-align: middle;
    }

    .icon-link--sm {
      --icon-size: 1.3em;
    }
  </style>
  {% if jekyll.environment == 'production' %}
  {% include analytics.html %}
  {% endif %}

</head>
